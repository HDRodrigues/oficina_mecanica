name: CD Deploy (EKS & K8s)

# Disparo manual — as credenciais AWS Academy são passadas como inputs porque
# tokens de sessão expiram em ~4h e não podem ser armazenados como secrets fixos.
on:
  workflow_dispatch:
    inputs:
      aws_access_key_id:
        description: 'AWS Access Key ID (AWS Academy)'
        required: true
        type: string
      aws_secret_access_key:
        description: 'AWS Secret Access Key (AWS Academy)'
        required: true
        type: string
      aws_session_token:
        description: 'AWS Session Token (AWS Academy)'
        required: true
        type: string

# Garante que apenas uma execução rode por vez. Acionar o cd_destroy.yml
# cancela este workflow imediatamente via o mesmo concurrency group.
concurrency:
  group: oficina-mecanica-eks
  cancel-in-progress: true

jobs:
  deploy:
    name: Provision & Deploy Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Mascara credenciais AWS e secrets do repositório nos logs deste job.
      # Deve ser o primeiro step executável do job.
      - name: Mask Sensitive Credentials
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"
          echo "::add-mask::${{ secrets.DB_PASSWORD }}"
          echo "::add-mask::${{ secrets.SECRET_KEY_BASE }}"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ inputs.aws_access_key_id }}
          aws-secret-access-key: ${{ inputs.aws_secret_access_key }}
          aws-session-token: ${{ inputs.aws_session_token }}
          aws-region: us-east-1

      # O bucket S3 armazena o Terraform state enquanto o ambiente estiver ativo.
      # Criado via CLI (não via Terraform) para evitar o chicken-and-egg: o backend
      # precisa existir antes do terraform init. O Account ID no nome garante
      # unicidade global. Idempotente: reutiliza o bucket se já existir.
      - name: Bootstrap S3 Backend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          TF_BUCKET="oficina-mecanica-tfstate-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$TF_BUCKET" 2>/dev/null; then
            echo "Bucket $TF_BUCKET já existe. Reutilizando..."
          else
            echo "Criando bucket $TF_BUCKET..."
            aws s3api create-bucket --bucket "$TF_BUCKET" --region us-east-1
          fi

          echo "TF_BUCKET=$TF_BUCKET" >> "$GITHUB_ENV"

      # terraform_wrapper: false evita que o wrapper adicione texto extra ao stdout,
      # garantindo que terraform output -raw capture valores limpos no GITHUB_OUTPUT.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # Provisiona toda a infraestrutura: VPC, EKS, RDS, ECR e Metrics Server.
      # db_password é passado via TF_VAR_ para evitar shell injection no -var flag.
      # Os outputs (RDS host, cluster name, ECR URL) são propagados para o próximo step.
      - name: Terraform Provisioning
        id: terraform
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        run: |
          cd infra/
          terraform init \
            -backend-config="bucket=$TF_BUCKET" \
            -backend-config="key=oficina-mecanica/terraform.tfstate" \
            -backend-config="region=us-east-1"

          terraform apply -auto-approve

          echo "RDS_HOST=$(terraform output -raw rds_address)" >> "$GITHUB_OUTPUT"
          echo "EKS_CLUSTER_NAME=$(terraform output -raw eks_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "ECR_URL=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      # Faz login no ECR, builda a imagem tagueada com o SHA do commit e faz push.
      - name: Build and Push Docker Image
        id: docker
        run: |
          # Extrai apenas o registry (account.dkr.ecr.region.amazonaws.com) da URL completa do ECR
          REGISTRY=$(echo "${{ steps.terraform.outputs.ECR_URL }}" | cut -d'/' -f1)
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$REGISTRY"

          IMAGE_URI="${{ steps.terraform.outputs.ECR_URL }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # Realiza o deploy no EKS em 3 fases:
      # 1. Substitui os placeholders dos manifests com os valores reais do ambiente
      # 2. Roda as migrations via Job (aguarda conclusão antes de avançar)
      # 3. Sobe os workloads (web, jobs, service, HPA)
      - name: Deploy to Kubernetes
        env:
          RDS_HOST: ${{ steps.terraform.outputs.RDS_HOST }}
          CLUSTER_NAME: ${{ steps.terraform.outputs.EKS_CLUSTER_NAME }}
          IMAGE_URI: ${{ steps.docker.outputs.image_uri }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region us-east-1

          # Secrets são base64-encoded pois o campo data: do K8s Secret exige isso
          DB_PASSWORD_B64=$(echo -n "${{ secrets.DB_PASSWORD }}" | base64 -w 0)
          SECRET_KEY_BASE_B64=$(echo -n "${{ secrets.SECRET_KEY_BASE }}" | base64 -w 0)

          # Substitui os placeholders dos manifests com os valores reais
          sed -i "s|DATABASE_HOST_PLACEHOLDER|$RDS_HOST|g" k8s/configmap.yaml
          sed -i "s|DATABASE_PASSWORD_PLACEHOLDER|$DB_PASSWORD_B64|g" k8s/secrets.yaml
          sed -i "s|SECRET_KEY_BASE_PLACEHOLDER|$SECRET_KEY_BASE_B64|g" k8s/secrets.yaml
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/web-deployment.yaml
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/jobs-deployment.yaml
          sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/db-prepare-job.yaml

          # Aplica configurações de ambiente antes dos workloads
          kubectl apply -f k8s/configmap.yaml -f k8s/secrets.yaml

          # Deleta o job anterior (se existir) e roda db:prepare — cria/migra todos os databases
          kubectl delete job oficina-mecanica-db-prepare --ignore-not-found=true
          kubectl apply -f k8s/db-prepare-job.yaml
          kubectl wait --for=condition=complete --timeout=300s job/oficina-mecanica-db-prepare

          # Sobe os workloads da aplicação
          kubectl apply -f k8s/web-deployment.yaml -f k8s/jobs-deployment.yaml -f k8s/service.yaml -f k8s/hpa.yaml

  auto-destroy:
    name: Autodestruição de Segurança
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Mascaramento repetido pois cada job tem seu próprio contexto de logs.
      - name: Mask Sensitive Credentials
        run: |
          echo "::add-mask::${{ inputs.aws_access_key_id }}"
          echo "::add-mask::${{ inputs.aws_secret_access_key }}"
          echo "::add-mask::${{ inputs.aws_session_token }}"
          echo "::add-mask::${{ secrets.DB_PASSWORD }}"

      # Janela de 2h para uso/demonstração do ambiente.
      # ATENÇÃO: tokens AWS Academy expiram em ~4h desde o início da sessão.
      # Tempo total estimado: ~30min deploy + 2h sleep + ~20min destroy = ~2h50min.
      # Iniciar o workflow com menos de 3h de sessão restante pode causar falha no destroy.
      - name: Safety Sleep (Wait 2 Hours)
        run: sleep 7200

      # Delega o destroy para a composite action compartilhada com o cd_destroy.yml.
      - name: Destroy Infrastructure
        uses: ./.github/actions/infra-destroy
        with:
          aws_access_key_id: ${{ inputs.aws_access_key_id }}
          aws_secret_access_key: ${{ inputs.aws_secret_access_key }}
          aws_session_token: ${{ inputs.aws_session_token }}
          db_password: ${{ secrets.DB_PASSWORD }}
