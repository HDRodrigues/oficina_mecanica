name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina_mecanica_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      RAILS_ENV: test
      COVERAGE: "1"
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare database
        run: bin/rails db:prepare

      - name: Run tests
        run: bundle exec rspec

      - name: Verify coverage thresholds
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            line=$(jq -r '.result.line' coverage/.last_run.json)
            branch=$(jq -r '.result.branch' coverage/.last_run.json)
            echo "Line coverage: ${line}%"
            echo "Branch coverage: ${branch}%"
            if (( $(echo "$line < 80" | bc -l) )); then
              echo "ERROR: Line coverage ${line}% is below threshold of 80%"
              exit 1
            fi
            if (( $(echo "$branch < 80" | bc -l) )); then
              echo "ERROR: Branch coverage ${branch}% is below threshold of 80%"
              exit 1
            fi
          fi

      - name: Write coverage to job summary
        if: always()
        run: |
          if [ -f coverage/.last_run.json ]; then
            line=$(jq -r '.result.line' coverage/.last_run.json)
            branch=$(jq -r '.result.branch' coverage/.last_run.json)
            {
              echo "## Coverage"
              echo ""
              echo "| Metric | Coverage |"
              echo "| --- | --- |"
              echo "| Line | ${line}% |"
              echo "| Branch | ${branch}% |"
              echo ""
              echo "Threshold: 80% line / 80% branch (enforced by SimpleCov and CI)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
